name: Build, Test & Deploy

# Deploys the Worker on every push to the default branch.
#
# PRs are deliberately NOT built here: ci.yml already runs typecheck + tests on
# every push and every PR, so duplicating that gate on this workflow would burn
# Actions minutes for no extra signal. The verify steps below stay because they
# gate the deploy itself — a red typecheck or test run must not reach production.
on:
  push:
    branches: [master]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (functions/**)
        run: pnpm run typecheck

      - name: Check (src/** — pages, components, API routes)
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The Cloudflare adapter emits the Worker config during `astro build`;
      # deploy reads it from there rather than the repo-root wrangler.toml.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config dist/server/wrangler.json
