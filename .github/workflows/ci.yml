name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # e2e (pnpm test:e2e) is intentionally omitted: it boots `astro dev`, which
      # needs the Cloudflare bindings from .dev.vars (gitignored secrets). Run it
      # locally as part of `pnpm run verify`. Unit tests + typecheck need no secrets.
