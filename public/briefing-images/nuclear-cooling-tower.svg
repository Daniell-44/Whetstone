<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#E8EAE0"/>
  <!-- horizon line -->
  <line x1="0" y1="520" x2="600" y2="520" stroke="#6B7A3E" stroke-width="1.5" opacity="0.5"/>
  <!-- cooling tower (hyperbolic silhouette) -->
  <g fill="none" stroke="#6B7A3E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 520 L235 400 Q232 340 260 300 L280 260 Q290 240 300 220 Q310 240 320 260 L340 300 Q368 340 365 400 L360 520 Z" fill="#EAEBE7"/>
    <!-- tower rim shadow -->
    <line x1="245" y1="285" x2="355" y2="285" stroke-width="3" opacity="0.4"/>
  </g>
  <!-- steam plume -->
  <g fill="none" stroke="#B8BFA8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M275 260 Q245 220 265 180 Q290 145 275 105 Q285 70 260 40"/>
    <path d="M305 260 Q335 220 315 180 Q290 145 305 105 Q295 70 320 40"/>
    <path d="M290 250 Q290 210 300 170"/>
  </g>
  <!-- ground base with reactor building silhouette -->
  <g fill="#6B7A3E">
    <rect x="180" y="520" width="240" height="8"/>
    <rect x="130" y="500" width="90" height="28" opacity="0.6"/>
    <rect x="410" y="490" width="70" height="38" opacity="0.6"/>
    <!-- distant pylon -->
    <g stroke="#6B7A3E" stroke-width="2" fill="none" opacity="0.5">
      <path d="M500 520 L505 470 L510 520 M497 490 L513 490"/>
      <line x1="510" y1="480" x2="600" y2="475"/>
    </g>
  </g>
  <!-- text label -->
  <g font-family="ui-monospace, monospace" fill="#4A5528" opacity="0.75">
    <text x="300" y="620" font-size="14" text-anchor="middle" letter-spacing="4">NUCLEAR ENERGY</text>
    <text x="300" y="650" font-size="10" text-anchor="middle" letter-spacing="3" opacity="0.7">AUSTRALIA · 2024–2026</text>
  </g>
</svg>
