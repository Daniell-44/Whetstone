# Cloudflare Pages project configuration.
# Used by `wrangler pages dev ./dist` for local development.
# Bindings and secrets in production are set in the Cloudflare Pages dashboard:
#   Settings → Functions → KV namespace bindings / Environment variables.

name = "devils-advocate-site"
# pages_build_output_dir removed: it caused wrangler v4 to enter Pages mode during
# the adapter's prerender step, which forbids an "ASSETS" binding the adapter auto-adds.
# Pass the output directory explicitly when deploying: `wrangler pages deploy dist`
compatibility_date = "2025-01-01"

# Deploy-routing settings.
# workers_dev = true keeps the *.workers.dev URL as a fallback while transitioning
# to the custom domain. Set to false once thewhetstone.net is fully verified in
# production (~1 week of stable use).
workers_dev = true
# preview_urls = false disables per-deploy *.workers.dev preview URLs. We don't
# use branch previews. Set to true if you start using `wrangler versions upload`.
preview_urls = false

# ---------------------------------------------------------------------------
# Observability — enables Workers Logs in the Cloudflare dashboard.
# After deploy: dashboard → your worker → Logs tab → Begin log stream.
# Lets you see console.log / console.error output in the browser without
# needing `wrangler tail` (which requires DNS to tail.developers.workers.dev).
# ---------------------------------------------------------------------------

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# ---------------------------------------------------------------------------
# KV namespace — rate limiting
# Create in the Cloudflare dashboard: Workers & Pages → KV → Create namespace
# Name it "RATE_LIMIT_DEV" (dev) / "RATE_LIMIT" (production), then paste the
# namespace ID below and in the Pages dashboard binding (name: RATE_LIMIT).
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding = "RATE_LIMIT"
id      = "f28cc72968cb476f809fe2047fe5b563"

# Astro adapter auto-creates this every deploy unless it sees the binding
# already. Pre-bind to skip recreation (otherwise deploy fails with 10014).
[[kv_namespaces]]
binding = "SESSION"
id      = "63cfdd20b0184a7a933d90f863f01720"

# ---------------------------------------------------------------------------
# KV namespace — scorecard storage
# Create the namespace: wrangler kv namespace create SCORECARDS
# Then paste the returned ID below (production) and into the Pages dashboard.
# For a preview namespace: wrangler kv namespace create SCORECARDS --preview
# Paste that ID as preview_id below.
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding    = "SCORECARDS"
id         = "3ace85b97e8e48a89abec51a906070d8"
preview_id = "eba00c98cb6d428d9651520d45468229"

# ---------------------------------------------------------------------------
# KV namespace — shareable audit permalinks (30-day TTL).
# Stores the audit JSON keyed by short ID (12-char base62). URL pattern:
#   /audit/<id>  → renders the audit view
#   /audit/<id>/card.svg → renders the OG card
#
# Create: wrangler kv namespace create AUDIT_LINKS
#         wrangler kv namespace create AUDIT_LINKS --preview
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding    = "AUDIT_LINKS"
id         = "eebd46622849454999a9fa8fa20bd7cf"
preview_id = "bcf2c52f114f4a7da0c8b087922bf0af"

# ---------------------------------------------------------------------------
# Environment variables (non-secret defaults shown here for documentation).
# Secrets (API keys, COST_TEST_SECRET) must be set in the Pages dashboard or
# .dev.vars — never in this file.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# D1 database — user accounts, sessions, magic links
# Single binding ("DB"), two underlying databases (prod + preview).
# Code accesses it as env.DB; preview_database_id is auto-used by `wrangler dev`.
#
# Create the databases (one-time):
#   wrangler d1 create whetstone-users
#   wrangler d1 create whetstone-users-preview
# Paste the returned IDs into database_id / preview_database_id below.
#
# Apply migration to BOTH databases (must do both, each time the schema changes):
#   wrangler d1 execute whetstone-users         --file=migrations/0001_init.sql --remote
#   wrangler d1 execute whetstone-users-preview --file=migrations/0001_init.sql --remote
# ---------------------------------------------------------------------------

[[d1_databases]]
binding             = "DB"
database_name       = "whetstone-users"
database_id         = "1485b1e6-f72c-4561-9865-84418976136b"
# Consolidated 2026-06-17: preview points at the SAME db as production so the live
# worker can no longer accidentally bind the old preview db (f49148ac…). One
# canonical DB pre-launch; reintroduce a separate staging db later if needed.
preview_database_id = "1485b1e6-f72c-4561-9865-84418976136b"

# ---------------------------------------------------------------------------
# Stripe setup checklist (do these before deploying CS-2):
#
# 1. stripe.com → switch to Test Mode (toggle top-right)
# 2. Products → Add Product: "The Whetstone Creator Studio"
#    Under that product, add a recurring monthly Price ($22/mo — price bumped from $15 in CS-6)
#    Copy the Price ID (starts price_...) and paste below as STRIPE_PRICE_ID
# 3. Developers → API Keys → copy the Test Mode secret key (starts sk_test_...)
# 4. After deploying once, Developers → Webhooks → Add endpoint:
#      URL: https://devils-advocate-site.daniellivingstone2005.workers.dev/api/billing/webhook
#      Events: customer.subscription.created, customer.subscription.updated,
#              customer.subscription.deleted, invoice.payment_succeeded, invoice.payment_failed
#    Copy the Webhook signing secret (starts whsec_...)
# 5. Set secrets:
#      npx wrangler secret put STRIPE_SECRET_KEY --config dist/server/wrangler.json
#      npx wrangler secret put STRIPE_WEBHOOK_SECRET --config dist/server/wrangler.json
# ---------------------------------------------------------------------------

[vars]
LLM_PROVIDER          = "gemini"
FREE_TIER_DAILY_CAP   = "10"
AUDIT_DAILY_CAP       = "10"
AUDIT_USER_DAILY_CAP  = "50"
COUNTERARG_DAILY_CAP  = "20"
COMMITMENTS_DAILY_CAP = "15"
CITATION_DAILY_CAP    = "10"
SITE_URL              = "https://thewhetstone.net"
# Set to "1" to log magic-link sign-in codes via console.log so they appear in
# `wrangler tail`. Useful when Resend email delivery is broken. Set to "0" or
# remove this line in real production.
AUTH_DEBUG_LOG_CODES  = "0"
# Replace after creating the Stripe product and price (see checklist above)
STRIPE_PRICE_ID       = "price_1ThNsH3xWchMRiIKgQiJik37"
# ALLOWED_ORIGINS: comma-separated. Example:
# ALLOWED_ORIGINS = "chrome-extension://YOUR_EXTENSION_ID,https://whetstone.so"
# RESEND_API_KEY is a secret — set via: wrangler secret put RESEND_API_KEY --config dist/server/wrangler.json
