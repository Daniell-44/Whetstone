# Cloudflare Pages project configuration.
# Used by `wrangler pages dev ./dist` for local development.
# Bindings and secrets in production are set in the Cloudflare Pages dashboard:
#   Settings → Functions → KV namespace bindings / Environment variables.

name = "devils-advocate-site"
# pages_build_output_dir removed: it caused wrangler v4 to enter Pages mode during
# the adapter's prerender step, which forbids an "ASSETS" binding the adapter auto-adds.
# Pass the output directory explicitly when deploying: `wrangler pages deploy dist`
compatibility_date = "2025-01-01"

# ---------------------------------------------------------------------------
# KV namespace — rate limiting
# Create in the Cloudflare dashboard: Workers & Pages → KV → Create namespace
# Name it "RATE_LIMIT_DEV" (dev) / "RATE_LIMIT" (production), then paste the
# namespace ID below and in the Pages dashboard binding (name: RATE_LIMIT).
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding = "RATE_LIMIT"
id      = "f28cc72968cb476f809fe2047fe5b563"

# ---------------------------------------------------------------------------
# KV namespace — scorecard storage
# Create the namespace: wrangler kv namespace create SCORECARDS
# Then paste the returned ID below (production) and into the Pages dashboard.
# For a preview namespace: wrangler kv namespace create SCORECARDS --preview
# Paste that ID as preview_id below.
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding    = "SCORECARDS"
id         = "3ace85b97e8e48a89abec51a906070d8"
preview_id = "eba00c98cb6d428d9651520d45468229"

# ---------------------------------------------------------------------------
# Environment variables (non-secret defaults shown here for documentation).
# Secrets (API keys, COST_TEST_SECRET) must be set in the Pages dashboard or
# .dev.vars — never in this file.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# D1 database — user accounts, sessions, magic links
# Single binding ("DB"), two underlying databases (prod + preview).
# Code accesses it as env.DB; preview_database_id is auto-used by `wrangler dev`.
#
# Create the databases (one-time):
#   wrangler d1 create whetstone-users
#   wrangler d1 create whetstone-users-preview
# Paste the returned IDs into database_id / preview_database_id below.
#
# Apply migration to BOTH databases (must do both, each time the schema changes):
#   wrangler d1 execute whetstone-users         --file=migrations/0001_init.sql --remote
#   wrangler d1 execute whetstone-users-preview --file=migrations/0001_init.sql --remote
# ---------------------------------------------------------------------------

[[d1_databases]]
binding             = "DB"
database_name       = "whetstone-users"
database_id         = "1485b1e6-f72c-4561-9865-84418976136b"
preview_database_id = "f49148ac-f43f-4e24-861f-347d00c07a59"

[vars]
LLM_PROVIDER          = "gemini"
FREE_TIER_DAILY_CAP   = "20"
AUDIT_DAILY_CAP       = "10"
AUDIT_USER_DAILY_CAP  = "50"
COUNTERARG_DAILY_CAP  = "20"
SITE_URL              = "https://devils-advocate-site.daniellivingstone2005.workers.dev"
# ALLOWED_ORIGINS: comma-separated. Example:
# ALLOWED_ORIGINS = "chrome-extension://YOUR_EXTENSION_ID,https://whetstone.so"
# RESEND_API_KEY is a secret — set via: wrangler secret put RESEND_API_KEY --config dist/server/wrangler.json
